[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyharness"
version = "0.1.0"
description = "A minimal coding agent harness for Chat Completions model APIs"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "PyYAML>=6.0"]

[project.scripts]
tinyharness = "tiny_harness.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
